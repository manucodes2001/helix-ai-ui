<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="strandTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="strandViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Premium rounded container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Base-pair rungs connecting the two strands -->
  <g stroke-linecap="round" opacity="0.85">
    <!-- Top rung -->
    <line x1="22" y1="16" x2="42" y2="16" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="8 3"/>
    <!-- Upper-mid cross -->
    <line x1="26" y1="24" x2="38" y2="24" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="5 2"/>
    <!-- Center pinch -->
    <circle cx="32" cy="32" r="2.5" fill="#E2E8F0"/>
    <!-- Lower-mid cross -->
    <line x1="26" y1="40" x2="38" y2="40" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="5 2"/>
    <!-- Bottom rung -->
    <line x1="22" y1="48" x2="42" y2="48" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="8 3"/>
  </g>

  <!-- Strand 1 (Teal/Cyan) - Left to Right Wave -->
  <path d="M 20 16 C 20 25, 44 23, 44 32 C 44 41, 20 39, 20 48" 
        fill="none" 
        stroke="url(#strandTeal)" 
        stroke-width="4.5" 
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Strand 2 (Violet/Indigo) - Right to Left Wave -->
  <path d="M 44 16 C 44 25, 20 23, 20 32 C 20 41, 44 39, 44 48" 
        fill="none" 
        stroke="url(#strandViolet)" 
        stroke-width="4.5" 
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Node points along strands -->
  <circle cx="20" cy="16" r="3.2" fill="#22D3EE"/>
  <circle cx="44" cy="16" r="3.2" fill="#A78BFA"/>
  <circle cx="26" cy="24" r="2.8" fill="#14B8A6"/>
  <circle cx="38" cy="24" r="2.8" fill="#8B5CF6"/>
  <circle cx="26" cy="40" r="2.8" fill="#8B5CF6"/>
  <circle cx="38" cy="40" r="2.8" fill="#14B8A6"/>
  <circle cx="20" cy="48" r="3.2" fill="#10B981"/>
  <circle cx="44" cy="48" r="3.2" fill="#6366F1"/>

  <!-- AI Intelligence Star (Top Right) -->
  <path d="M 52 8 Q 52 13 47 13 Q 52 13 52 18 Q 52 13 57 13 Q 52 13 52 8 Z" fill="url(#sparkleGrad)"/>
</svg>
